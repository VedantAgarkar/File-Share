<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background rounded gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer glowing cyan-indigo accent ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Drop gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Subtle Wi-Fi Wave Radials -->
  <path d="M 120 220 A 180 180 0 0 1 392 220" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.35" />
  <path d="M 160 260 A 130 130 0 0 1 352 260" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.65" />
  <path d="M 200 300 A 80 80 0 0 1 312 300" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.95" />

  <!-- Center Waterdrop / Direct Pin Icon with Glowing Arrow -->
  <g filter="url(#glow)">
    <!-- Droplet Body -->
    <path d="M 256 140 C 256 140 164 250 164 320 C 164 370 205 410 256 410 C 307 410 348 370 348 320 C 348 250 256 140 256 140 Z"
          fill="url(#dropGrad)" filter="url(#softShadow)" />
  </g>

  <!-- Download Beam Arrow Inside Drop -->
  <g fill="#ffffff">
    <!-- Arrow Stem -->
    <rect x="242" y="235" width="28" height="70" rx="8" />
    <!-- Arrow Head -->
    <polygon points="210,295 256,350 302,295" />
  </g>

  <!-- Speed lightning beacon point -->
  <circle cx="256" cy="190" r="12" fill="#ffffff" opacity="0.9" />
</svg>
